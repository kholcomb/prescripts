# CI workflow for prescripts.
# Builds from source, runs the test suite, then uses the local binary to scan
# this repo's own dependencies — so every PR is checked with the latest code.
# Results appear in the GitHub Security tab (SARIF upload).

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write   # required for SARIF upload

jobs:
  ci:
    name: Test and scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Scan own dependencies
        run: node dist/src/index.js scan . --output-dir . --min-risk medium

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        if: always()   # upload even when the scan step fails
        with:
          sarif_file: results.sarif
