# Smoke-tests the composite action against this repo's own dependencies.
# Runs on PRs that touch action.yml so we don't burn CI minutes on every push.

name: Test composite action

on:
  pull_request:
    paths:
      - 'action.yml'

permissions:
  contents: read
  security-events: write

jobs:
  test-action:
    name: Self-scan via composite action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run prescripts action (local)
        uses: ./
        with:
          min-risk: medium
          upload-sarif: true
          output-dir: .

