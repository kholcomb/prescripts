# Smoke-tests the composite action against this repo's own dependencies.
# Runs on PRs that touch action.yml so we don't burn CI minutes on every push.

name: Test composite action

on:
  pull_request:
    paths:
      - 'action.yml'

permissions:
  contents: read
  security-events: write

jobs:
  test-action:
    name: Self-scan via composite action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Build and pack
        id: pack
        run: |
          npm ci
          npm run build
          TARBALL=$(npm pack)
          echo "tarball=./$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Run prescripts action (local build)
        uses: ./
        with:
          version: ${{ steps.pack.outputs.tarball }}
          min-risk: medium
          upload-sarif: true
          output-dir: .
